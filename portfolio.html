<!-- Lightbox -->
<div class="lightbox">
  <button class="lightbox__close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l16 16M20 4L4 20"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--prev" aria-label="Previous photograph">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--next" aria-label="Next photograph">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <div class="lightbox__inner">
    <div class="lightbox__img-wrap"><img src="" alt=""></div>
    <div class="lightbox__meta">
      <h3 data-field="common"></h3>
      <p class="sci" data-field="sci"></p>
      <p class="note" data-field="note"></p>
      <dl class="lightbox__specs">
        <dt>Location</dt><dd data-field="location"></dd>
        <dt>Date</dt><dd data-field="date"></dd>
        <dt>Camera</dt><dd data-field="camera"></dd>
        <dt>Lens</dt><dd data-field="lens"></dd>
        <dt>ISO</dt><dd data-field="iso"></dd>
        <dt>Exposure</dt><dd data-field="exposure"></dd>
      </dl>
    </div>
  </div>
</div>
